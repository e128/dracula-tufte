name: contract-check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify the seven contract files exist
        run: |
          for f in tufte-dracula.css mermaid.js tokens.css sample.html sample-conn-map.html build-sample.nu README.md; do
            test -f "$f" || { echo "MISSING: $f"; exit 1; }
          done
          echo "All 7 contract files present."

      - name: Sanity check (no hand-rolled style blocks)
        run: |
          # tufte-dracula.css/mermaid.js are contracts that already carry their own
          # <style>/<script> wrapper, and build-sample.nu inlines them verbatim into
          # each fixture -- so exactly one <style> and one <script> block is expected.
          # More than one means a hand-rolled block was added alongside the canonical one.
          for f in sample.html sample-conn-map.html; do
            n=$(grep -c "<style" "$f")
            [ "$n" -eq 1 ] || { echo "$f: expected exactly 1 <style> block (canonical CSS), found $n"; exit 1; }
            n=$(grep -c "<script" "$f")
            [ "$n" -eq 1 ] || { echo "$f: expected exactly 1 <script> block (canonical mermaid.js), found $n"; exit 1; }
          done
          echo "No hand-rolled style/script blocks."
