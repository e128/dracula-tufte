# Dracula-Tufte (muted) Halloween: tmux theme
#
# Every value is the sRGB rendering of a tufte-dracula.css :root oklch() token,
# from the seasonal block behind data-season="halloween". Style only, no content:
# status-bar text, window-list format and key bindings stay whatever your own
# tmux.conf already sets.
#
# Install: add to ~/.tmux.conf
#   source-file ~/.config/tmux/dracula-tufte-halloween.conf

set -g status-style "bg=#1a0919,fg=#f8f3e9"
set -g status-left-style "fg=#d4c2a4,bg=#1a0919"
set -g status-right-style "fg=#bbac92,bg=#1a0919"

set -g window-status-style "fg=#bbac92,bg=#1a0919"
set -g window-status-current-style "fg=#271326,bg=#8cc5e6,bold"
set -g window-status-activity-style "fg=#fb9d59,bg=#1a0919"
set -g window-status-bell-style "fg=#ff7a7b,bg=#1a0919,bold"

set -g pane-border-style "fg=#846b81"
set -g pane-active-border-style "fg=#8cc5e6"

set -g message-style "bg=#371f35,fg=#f8f3e9"
set -g message-command-style "bg=#371f35,fg=#8cc5e6"

set -g mode-style "bg=#8cc5e6,fg=#271326"

set -g clock-mode-colour "#8cc5e6"
set -g clock-mode-style 24
