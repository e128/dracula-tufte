# Dracula-Tufte (muted) Oktoberfest: tmux theme
#
# Every value is the sRGB rendering of a tufte-dracula.css :root oklch() token,
# from the seasonal block behind data-season="oktoberfest". Style only, no content:
# status-bar text, window-list format and key bindings stay whatever your own
# tmux.conf already sets.
#
# Install: add to ~/.tmux.conf
#   source-file ~/.config/tmux/dracula-tufte-oktoberfest.conf

set -g status-style "bg=#311c09,fg=#faf5ea"
set -g status-left-style "fg=#d8c8ae,bg=#311c09"
set -g status-right-style "fg=#c1b29a,bg=#311c09"

set -g window-status-style "fg=#c1b29a,bg=#311c09"
set -g window-status-current-style "fg=#402712,bg=#8fc7e2,bold"
set -g window-status-activity-style "fg=#f2af48,bg=#311c09"
set -g window-status-bell-style "fg=#ff7a7b,bg=#311c09,bold"

set -g pane-border-style "fg=#9b806b"
set -g pane-active-border-style "fg=#8fc7e2"

set -g message-style "bg=#4f331b,fg=#faf5ea"
set -g message-command-style "bg=#4f331b,fg=#8fc7e2"

set -g mode-style "bg=#8fc7e2,fg=#402712"

set -g clock-mode-colour "#8fc7e2"
set -g clock-mode-style 24
