# Dracula-Tufte (muted): tmux theme
#
# Every value is the sRGB rendering of a tufte-dracula.css :root oklch() token.
# Style only, no content: status-bar text, window-list format and key bindings
# stay whatever your own tmux.conf already sets.
#
# Install: add to ~/.tmux.conf
#   source-file ~/.config/tmux/dracula-tufte.conf

set -g status-style "bg=#1e1f29,fg=#f8f8f2"
set -g status-left-style "fg=#b7bfe4,bg=#1e1f29"
set -g status-right-style "fg=#979fc4,bg=#1e1f29"

set -g window-status-style "fg=#979fc4,bg=#1e1f29"
set -g window-status-current-style "fg=#282a36,bg=#8fc9d9,bold"
set -g window-status-activity-style "fg=#eaa465,bg=#1e1f29"
set -g window-status-bell-style "fg=#ff7a7b,bg=#1e1f29,bold"

set -g pane-border-style "fg=#707388"
set -g pane-active-border-style "fg=#8fc9d9"

set -g message-style "bg=#343746,fg=#f8f8f2"
set -g message-command-style "bg=#343746,fg=#8fc9d9"

set -g mode-style "bg=#8fc9d9,fg=#282a36"

set -g clock-mode-colour "#8fc9d9"
set -g clock-mode-style 24
