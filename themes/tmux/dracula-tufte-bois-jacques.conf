# Dracula-Tufte (muted) Bois Jacques: tmux theme
#
# Every value is the sRGB rendering of a tufte-dracula.css :root oklch() token,
# from the seasonal block behind data-season="bois-jacques". Style only, no content:
# status-bar text, window-list format and key bindings stay whatever your own
# tmux.conf already sets.
#
# Install: add to ~/.tmux.conf
#   source-file ~/.config/tmux/dracula-tufte-bois-jacques.conf

set -g status-style "bg=#070b11,fg=#eff4f8"
set -g status-left-style "fg=#b1c0cd,bg=#070b11"
set -g status-right-style "fg=#9aaab9,bg=#070b11"

set -g window-status-style "fg=#9aaab9,bg=#070b11"
set -g window-status-current-style "fg=#11161d,bg=#8bc3e4,bold"
set -g window-status-activity-style "fg=#f3ae51,bg=#070b11"
set -g window-status-bell-style "fg=#ff716b,bg=#070b11,bold"

set -g pane-border-style "fg=#687686"
set -g pane-active-border-style "fg=#8bc3e4"

set -g message-style "bg=#1d242d,fg=#eff4f8"
set -g message-command-style "bg=#1d242d,fg=#8bc3e4"

set -g mode-style "bg=#8bc3e4,fg=#11161d"

set -g clock-mode-colour "#8bc3e4"
set -g clock-mode-style 24
