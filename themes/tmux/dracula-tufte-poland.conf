# Dracula-Tufte (muted) Poland: tmux theme
#
# Every value is the sRGB rendering of a tufte-dracula.css :root oklch() token,
# from the seasonal block behind data-season="poland". Style only, no content:
# status-bar text, window-list format and key bindings stay whatever your own
# tmux.conf already sets.
#
# Install: add to ~/.tmux.conf
#   source-file ~/.config/tmux/dracula-tufte-poland.conf

set -g status-style "bg=#27080a,fg=#f8f7f2"
set -g status-left-style "fg=#daccb5,bg=#27080a"
set -g status-right-style "fg=#c0b29c,bg=#27080a"

set -g window-status-style "fg=#c0b29c,bg=#27080a"
set -g window-status-current-style "fg=#371111,bg=#debe82,bold"
set -g window-status-activity-style "fg=#e7b551,bg=#27080a"
set -g window-status-bell-style "fg=#ff716b,bg=#27080a,bold"

set -g pane-border-style "fg=#9c7571"
set -g pane-active-border-style "fg=#debe82"

set -g message-style "bg=#491d1d,fg=#f8f7f2"
set -g message-command-style "bg=#491d1d,fg=#debe82"

set -g mode-style "bg=#debe82,fg=#371111"

set -g clock-mode-colour "#debe82"
set -g clock-mode-style 24
