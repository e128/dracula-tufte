# Dracula-Tufte (muted) Chartreuse: tmux theme
#
# Every value is the sRGB rendering of a tufte-dracula.css :root oklch() token,
# from the seasonal block behind data-season="chartreuse". Style only, no content:
# status-bar text, window-list format and key bindings stay whatever your own
# tmux.conf already sets.
#
# Install: add to ~/.tmux.conf
#   source-file ~/.config/tmux/dracula-tufte-chartreuse.conf

set -g status-style "bg=#3f4405,fg=#f7f8ed"
set -g status-left-style "fg=#dee3b5,bg=#3f4405"
set -g status-right-style "fg=#cbcfa6,bg=#3f4405"

set -g window-status-style "fg=#cbcfa6,bg=#3f4405"
set -g window-status-current-style "fg=#4d5208,bg=#9dd7d7,bold"
set -g window-status-activity-style "fg=#e7be67,bg=#3f4405"
set -g window-status-bell-style "fg=#ffafae,bg=#3f4405,bold"

set -g pane-border-style "fg=#b0b591"
set -g pane-active-border-style "fg=#9dd7d7"

set -g message-style "bg=#454a04,fg=#f7f8ed"
set -g message-command-style "bg=#454a04,fg=#9dd7d7"

set -g mode-style "bg=#9dd7d7,fg=#4d5208"

set -g clock-mode-colour "#9dd7d7"
set -g clock-mode-style 24
