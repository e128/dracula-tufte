# Dracula-Tufte (muted) Birthday: tmux theme
#
# Every value is the sRGB rendering of a tufte-dracula.css :root oklch() token,
# from the seasonal block behind data-season="birthday". Style only, no content:
# status-bar text, window-list format and key bindings stay whatever your own
# tmux.conf already sets.
#
# Install: add to ~/.tmux.conf
#   source-file ~/.config/tmux/dracula-tufte-birthday.conf

set -g status-style "bg=#1d0106,fg=#f9f5ec"
set -g status-left-style "fg=#d5c5ab,bg=#1d0106"
set -g status-right-style "fg=#bcad95,bg=#1d0106"

set -g window-status-style "fg=#bcad95,bg=#1d0106"
set -g window-status-current-style "fg=#29050e,bg=#8cc8e0,bold"
set -g window-status-activity-style "fg=#e5b64a,bg=#1d0106"
set -g window-status-bell-style "fg=#ff7a7b,bg=#1d0106,bold"

set -g pane-border-style "fg=#856f83"
set -g pane-active-border-style "fg=#8cc8e0"

set -g message-style "bg=#3b121a,fg=#f9f5ec"
set -g message-command-style "bg=#3b121a,fg=#8cc8e0"

set -g mode-style "bg=#8cc8e0,fg=#29050e"

set -g clock-mode-colour "#8cc8e0"
set -g clock-mode-style 24
