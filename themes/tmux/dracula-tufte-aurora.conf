# Dracula-Tufte (muted) Aurora: tmux theme
#
# Every value is the sRGB rendering of a tufte-dracula.css :root oklch() token,
# from the seasonal block behind data-season="aurora". Style only, no content:
# status-bar text, window-list format and key bindings stay whatever your own
# tmux.conf already sets.
#
# Install: add to ~/.tmux.conf
#   source-file ~/.config/tmux/dracula-tufte-aurora.conf

set -g status-style "bg=#06001b,fg=#eff6fb"
set -g status-left-style "fg=#adc5d6,bg=#06001b"
set -g status-right-style "fg=#98aebf,bg=#06001b"

set -g window-status-style "fg=#98aebf,bg=#06001b"
set -g window-status-current-style "fg=#0f0528,bg=#82cbd8,bold"
set -g window-status-activity-style "fg=#e6b14e,bg=#06001b"
set -g window-status-bell-style "fg=#ff7a7b,bg=#06001b,bold"

set -g pane-border-style "fg=#6b748d"
set -g pane-active-border-style "fg=#82cbd8"

set -g message-style "bg=#190f37,fg=#eff6fb"
set -g message-command-style "bg=#190f37,fg=#82cbd8"

set -g mode-style "bg=#82cbd8,fg=#0f0528"

set -g clock-mode-colour "#82cbd8"
set -g clock-mode-style 24
