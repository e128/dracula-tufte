# Dracula-Tufte (muted) Christmas: tmux theme
#
# Every value is the sRGB rendering of a tufte-dracula.css :root oklch() token,
# from the seasonal block behind data-season="christmas". Style only, no content:
# status-bar text, window-list format and key bindings stay whatever your own
# tmux.conf already sets.
#
# Install: add to ~/.tmux.conf
#   source-file ~/.config/tmux/dracula-tufte-christmas.conf

set -g status-style "bg=#0d1e13,fg=#faf8ef"
set -g status-left-style "fg=#b3d0b8,bg=#0d1e13"
set -g status-right-style "fg=#9ebaa2,bg=#0d1e13"

set -g window-status-style "fg=#9ebaa2,bg=#0d1e13"
set -g window-status-current-style "fg=#182c1f,bg=#9fc5d9,bold"
set -g window-status-activity-style "fg=#d3b064,bg=#0d1e13"
set -g window-status-bell-style "fg=#ff7a7e,bg=#0d1e13,bold"

set -g pane-border-style "fg=#5d7e68"
set -g pane-active-border-style "fg=#9fc5d9"

set -g message-style "bg=#243a2c,fg=#faf8ef"
set -g message-command-style "bg=#243a2c,fg=#9fc5d9"

set -g mode-style "bg=#9fc5d9,fg=#182c1f"

set -g clock-mode-colour "#9fc5d9"
set -g clock-mode-style 24
