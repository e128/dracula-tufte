# Dracula-Tufte (muted) Thanksgiving: tmux theme
#
# Every value is the sRGB rendering of a tufte-dracula.css :root oklch() token,
# from the seasonal block behind data-season="thanksgiving". Style only, no content:
# status-bar text, window-list format and key bindings stay whatever your own
# tmux.conf already sets.
#
# Install: add to ~/.tmux.conf
#   source-file ~/.config/tmux/dracula-tufte-thanksgiving.conf

set -g status-style "bg=#1b1008,fg=#f9f6eb"
set -g status-left-style "fg=#d9c4a8,bg=#1b1008"
set -g status-right-style "fg=#c0ae95,bg=#1b1008"

set -g window-status-style "fg=#c0ae95,bg=#1b1008"
set -g window-status-current-style "fg=#291b0f,bg=#84c7d3,bold"
set -g window-status-activity-style "fg=#f7aa45,bg=#1b1008"
set -g window-status-bell-style "fg=#ff7a7a,bg=#1b1008,bold"

set -g pane-border-style "fg=#867162"
set -g pane-active-border-style "fg=#84c7d3"

set -g message-style "bg=#3b2a1e,fg=#f9f6eb"
set -g message-command-style "bg=#3b2a1e,fg=#84c7d3"

set -g mode-style "bg=#84c7d3,fg=#291b0f"

set -g clock-mode-colour "#84c7d3"
set -g clock-mode-style 24
