# Dracula-Tufte (muted) Independence Day: tmux theme
#
# Every value is the sRGB rendering of a tufte-dracula.css :root oklch() token,
# from the seasonal block behind data-season="independence-day". Style only, no content:
# status-bar text, window-list format and key bindings stay whatever your own
# tmux.conf already sets.
#
# Install: add to ~/.tmux.conf
#   source-file ~/.config/tmux/dracula-tufte-independence-day.conf

set -g status-style "bg=#071129,fg=#f2f7fd"
set -g status-left-style "fg=#b8cde4,bg=#071129"
set -g status-right-style "fg=#9eb4ca,bg=#071129"

set -g window-status-style "fg=#9eb4ca,bg=#071129"
set -g window-status-current-style "fg=#101d38,bg=#96c6dd,bold"
set -g window-status-activity-style "fg=#e7af5c,bg=#071129"
set -g window-status-bell-style "fg=#ff7a7e,bg=#071129,bold"

set -g pane-border-style "fg=#6e829b"
set -g pane-active-border-style "fg=#96c6dd"

set -g message-style "bg=#1b2948,fg=#f2f7fd"
set -g message-command-style "bg=#1b2948,fg=#96c6dd"

set -g mode-style "bg=#96c6dd,fg=#101d38"

set -g clock-mode-colour "#96c6dd"
set -g clock-mode-style 24
