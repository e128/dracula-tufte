# Dracula-Tufte (muted) St Patrick: tmux theme
#
# Every value is the sRGB rendering of a tufte-dracula.css :root oklch() token,
# from the seasonal block behind data-season="st-patrick". Style only, no content:
# status-bar text, window-list format and key bindings stay whatever your own
# tmux.conf already sets.
#
# Install: add to ~/.tmux.conf
#   source-file ~/.config/tmux/dracula-tufte-st-patrick.conf

set -g status-style "bg=#012514,fg=#f4f9f0"
set -g status-left-style "fg=#b5d5b5,bg=#012514"
set -g status-right-style "fg=#9eba9e,bg=#012514"

set -g window-status-style "fg=#9eba9e,bg=#012514"
set -g window-status-current-style "fg=#02331d,bg=#93c7d9,bold"
set -g window-status-activity-style "fg=#e4b24d,bg=#012514"
set -g window-status-bell-style "fg=#ff7a7e,bg=#012514,bold"

set -g pane-border-style "fg=#708d79"
set -g pane-active-border-style "fg=#93c7d9"

set -g message-style "bg=#0c4128,fg=#f4f9f0"
set -g message-command-style "bg=#0c4128,fg=#93c7d9"

set -g mode-style "bg=#93c7d9,fg=#02331d"

set -g clock-mode-colour "#93c7d9"
set -g clock-mode-style 24
